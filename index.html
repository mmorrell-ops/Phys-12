s|qa|What is a gauge boson?|A force-carrying particle exchanged between matter particles to mediate a fundamental interaction. They have integer spin, unlike quarks and leptons.|
s|qa|Compare the strong nuclear, weak nuclear and electromagnetic forces.|Strong: mediated by gluons, acts on quarks only, strongest, but acting only over a range comparable to the size of a nucleus. Electromagnetic: mediated by photons, acts on all charged particles, infinite range. Weak: mediated by W and Z bosons, acts on all quarks and leptons, extremely short range, responsible for beta decay.|
s|qa|Contrast the fundamental forces experienced by quarks and leptons.|Quarks experience all of them — strong, weak, electromagnetic and gravitational. Leptons do not experience the strong nuclear force. Neutral leptons (neutrinos) also do not experience the electromagnetic force.|
s|cloze|Leptons never experience the [[strong nuclear]] force, which is why they are never found bound inside hadrons.|This is the defining distinction between the two families of matter particles.|
s|qa|Give the relationships for baryon number.|$B = n_b - n_{\bar{b}}$ counted over baryons, or $B = \dfrac{1}{3}(n_q - n_{\bar{q}})$ counted over quarks. Baryon number is conserved in all interactions.|
s|qa|Give the relationship for lepton number.|$L = n_l - n_{\bar{l}}$. Leptons have $L = +1$, antileptons $L = -1$, and all other particles $L = 0$. Lepton number is conserved.|
s|qa|What quantities must be conserved in any particle interaction?|Charge, baryon number, lepton number, and energy–momentum. An interaction that violates any of these cannot occur.|
s|qa|Write the equation for neutron decay and identify the particles.|$n \rightarrow p + e^- + \bar{\nu}_e$. A neutron becomes a proton, an electron, and an electron antineutrino. This is beta-minus decay.|
s|qa|Why must an antineutrino, not a neutrino, be produced in beta-minus decay?|To conserve lepton number. The electron has $L = +1$, and the initial neutron has $L = 0$, so an antineutrino with $L = -1$ is required to balance.|
s|qa|Describe beta-minus decay at the quark level.|A down quark converts into an up quark, emitting a $W^-$ boson which decays into an electron and an electron antineutrino. The neutron (udd) therefore becomes a proton (uud).|
s|qa|Describe beta-plus decay at the quark level.|An up quark converts into a down quark, emitting a $W^+$ boson which decays into a positron and an electron neutrino. A proton within the nucleus becomes a neutron.|
s|svg|Interpret this particle interaction diagram for neutron decay.|Time runs to the right. The neutron enters, a down quark emits a $W^-$ boson and becomes an up quark, converting the neutron to a proton. The $W^-$ then decays into an electron and an electron antineutrino.|Arrows pointing backwards in time indicate antiparticles — that is how the antineutrino is identified.|<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img"><g stroke="currentColor" stroke-width="1.8" fill="none"><line x1="30" y1="130" x2="140" y2="130"/><line x1="140" y1="130" x2="250" y2="130"/></g><polygon points="92,130 84,126 84,134" fill="currentColor"/><polygon points="200,130 192,126 192,134" fill="currentColor"/><path d="M140 130 q6 -18 12 -30 q6 -12 12 -24" stroke="var(--signal)" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/><g stroke="currentColor" stroke-width="1.8" fill="none"><line x1="164" y1="76" x2="250" y2="46"/><line x1="164" y1="76" x2="250" y2="98"/></g><polygon points="214,60 204,60 209,68" fill="currentColor"/><polygon points="200,80 210,86 210,78" fill="currentColor"/><circle cx="140" cy="130" r="3.5" fill="currentColor"/><circle cx="164" cy="76" r="3.5" fill="currentColor"/><text x="34" y="150" font-size="11" font-family="monospace" fill="currentColor">n (udd)</text><text x="206" y="150" font-size="11" font-family="monospace" fill="currentColor">p (uud)</text><text x="256" y="46" font-size="11" font-family="monospace" fill="currentColor">e-</text><text x="256" y="102" font-size="11" font-family="monospace" fill="currentColor">anti-v</text><text x="146" y="92" font-size="11" font-family="monospace" fill="var(--signal)">W-</text><text x="30" y="172" font-size="10" font-family="monospace" fill="currentColor" opacity=".7">time</text><line x1="52" y1="168" x2="110" y2="168" stroke="currentColor" stroke-width="1"/><polygon points="116,168 106,164 106,172" fill="currentColor"/></svg>
s|svg|Interpret this diagram of electron–positron annihilation.|An electron and a positron meet at a vertex and annihilate, producing a virtual photon which then produces a new particle–antiparticle pair. Charge, lepton number and energy are all conserved through the vertex.||<svg viewBox="0 0 320 170" xmlns="http://www.w3.org/2000/svg" role="img"><g stroke="currentColor" stroke-width="1.8" fill="none"><line x1="34" y1="40" x2="120" y2="85"/><line x1="34" y1="130" x2="120" y2="85"/><line x1="200" y1="85" x2="286" y2="40"/><line x1="200" y1="85" x2="286" y2="130"/></g><polygon points="86,67 76,66 82,74" fill="currentColor"/><polygon points="76,104 86,103 80,96" fill="currentColor"/><polygon points="240,62 250,58 246,66" fill="currentColor"/><polygon points="246,104 236,108 240,100" fill="currentColor"/><path d="M120 85 q10 -9 20 0 q10 9 20 0 q10 -9 20 0 q10 9 20 0" stroke="var(--signal)" stroke-width="1.8" fill="none"/><circle cx="120" cy="85" r="3.5" fill="currentColor"/><circle cx="200" cy="85" r="3.5" fill="currentColor"/><text x="8" y="36" font-size="11" font-family="monospace" fill="currentColor">e-</text><text x="8" y="142" font-size="11" font-family="monospace" fill="currentColor">e+</text><text x="290" y="36" font-size="11" font-family="monospace" fill="currentColor">q</text><text x="288" y="142" font-size="11" font-family="monospace" fill="currentColor">anti-q</text><text x="142" y="70" font-size="11" font-family="monospace" fill="var(--signal)">photon</text></svg>
s|svg|Interpret this electron–electron interaction diagram.|Two electrons approach, exchange a virtual photon at the two vertices, and recoil apart. The exchanged photon is the mediator of the electromagnetic repulsion between them.||<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg" role="img"><g stroke="currentColor" stroke-width="1.8" fill="none"><line x1="30" y1="30" x2="120" y2="55"/><line x1="120" y1="55" x2="270" y2="30"/><line x1="30" y1="140" x2="120" y2="115"/><line x1="120" y1="115" x2="270" y2="140"/></g><polygon points="80,44 70,42 76,50" fill="currentColor"/><polygon points="200,42 190,44 196,50" fill="currentColor"/><polygon points="80,126 70,128 76,120" fill="currentColor"/><polygon points="200,128 190,126 196,120" fill="currentColor"/><path d="M120 55 q9 10 0 20 q-9 10 0 20 q9 10 0 20" stroke="var(--signal)" stroke-width="1.8" fill="none"/><circle cx="120" cy="55" r="3.5" fill="currentColor"/><circle cx="120" cy="115" r="3.5" fill="currentColor"/><text x="8" y="26" font-size="11" font-family="monospace" fill="currentColor">e-</text><text x="8" y="152" font-size="11" font-family="monospace" fill="currentColor">e-</text><text x="130" y="90" font-size="11" font-family="monospace" fill="var(--signal)">virtual photon</text><text x="24" y="166" font-size="10" font-family="monospace" fill="currentColor" opacity=".7">time to the right</text></svg>
s|qa|In a particle interaction diagram, what do the axes and arrow directions represent?|One axis is time (conventionally to the right) and the other is space. Arrows pointing forward in time indicate particles; arrows pointing backward in time indicate antiparticles.|
s|qa|What happens at a vertex in a particle interaction diagram?|An interaction occurs and a force-carrying boson is emitted or absorbed. All conservation rules — charge, baryon number, lepton number — must hold at every vertex.|
s|qa|Explain how symmetry in particle interactions maintains the principles of conservation.|Interactions are symmetric under the combined operations of charge conjugation (C), parity (P) and time reversal (T). Applying all three to a valid interaction produces another valid interaction, and the conserved quantities — charge, baryon number and lepton number — balance in both.|
s|qa|What do C, P and T stand for in particle interactions?|Charge conjugation (C): replace every particle with its antiparticle. Parity (P): invert the spatial coordinates, giving a mirror image. Time reversal (T): run the interaction backwards in time.|
s|qa|Apply C symmetry to beta-minus decay $n \rightarrow p + e^- + \bar{\nu}_e$. What interaction results?|Every particle is replaced by its antiparticle: $\bar{n} \rightarrow \bar{p} + e^+ + \nu_e$. Charge, baryon number and lepton number each balance in the new interaction as they did in the original.|
s|qa|How does time reversal symmetry relate a decay to another interaction?|Reversing the arrow turns the products back into the reactants, so a decay becomes a capture and an emission becomes an absorption. The same conserved quantities balance in either direction.|
s|qa|Give the quark composition of an antiproton.|Two anti-up quarks and one anti-down quark, with total charge $-1$ and baryon number $-1$.|
s|qa|Give the quark composition of a positive pion.|An up quark and an anti-down quark, giving charge $+1$ and baryon number 0.|
s|qa|Determine whether this interaction is permitted by the conservation rules: $p \rightarrow n + e^+ + \nu_e$|Check each conserved quantity. Charge: $+1 \rightarrow 0 + 1 + 0$, balanced. Baryon number: $+1 \rightarrow +1 + 0 + 0$, balanced. Lepton number: $0 \rightarrow 0 - 1 + 1$, balanced. All three are conserved, so the interaction is permitted.|
s|qa|How do you check whether a proposed particle interaction can occur?|Total charge, baryon number and lepton number must each be equal before and after. If any one of the three fails to balance, the interaction cannot occur.|
s|qa|What are the lepton numbers of an electron, a positron, a neutrino and an antineutrino?|Electron $+1$, positron $-1$, neutrino $+1$, antineutrino $-1$.|
s|qa|Calculate the baryon number of a meson using the quark relationship.|$B = \tfrac{1}{3}(n_q - n_{\bar{q}}) = \tfrac{1}{3}(1 - 1) = 0$. A meson contains one quark and one antiquark.|
s|qa|Calculate the baryon number of a proton using the quark relationship.|$B = \tfrac{1}{3}(3 - 0) = +1$. Three quarks and no antiquarks.|
s|qa|Why must charge be conserved in a particle interaction?|Because interactions are symmetric under charge conjugation. No observed interaction has ever violated charge conservation, and any proposed interaction that does not balance charge is rejected.|
s|qa|Distinguish elementary particles from composite particles, giving examples.|Elementary particles have no substructure — quarks, leptons and gauge bosons. Composite particles are built from them — protons, neutrons, pions and all other hadrons.|
s|qa|Which fundamental force is responsible for beta decay, and which boson mediates it?|The weak nuclear force, mediated by the $W$ bosons. It is the only interaction that can change one flavour of quark into another.|
d|qa|What is absolute uncertainty, and how is it written?|The uncertainty expressed in the same units as the measurement, stated as a range: $12.4 \pm 0.2$ cm. It gives the interval within which the true value is expected to lie.|
d|qa|Give the relationship for percentage uncertainty.|$\text{percentage uncertainty} = \dfrac{\text{absolute uncertainty}}{\text{measurement}} \times 100\%$|
d|qa|Give the relationship for the absolute uncertainty of a mean.|$\Delta\bar{x} = \pm\dfrac{(x_{max} - x_{min})}{2}$ — half the range of the repeated measurements.|
d|qa|How is uncertainty propagated when quantities are added or subtracted?|Add the absolute uncertainties. This applies to subtraction as well as addition — uncertainty always grows, never cancels.|
d|qa|How is uncertainty propagated when quantities are multiplied or divided?|Add the percentage uncertainties, then convert back to an absolute uncertainty at the end if required.|
d|qa|How is uncertainty propagated when a quantity is raised to a power?|Multiply the percentage uncertainty by the exponent. Squaring a quantity doubles its percentage uncertainty; cubing triples it.|
d|calc|A length is $4.0 \pm 0.2$ m. What is the percentage uncertainty in its area if the shape is a square?|The length has 5% uncertainty. Area involves the square, so the percentage uncertainty is $2 \times 5\% = 10\%$.|
d|calc|Two masses, $250 \pm 5$ g and $180 \pm 3$ g, are subtracted. What is the uncertainty in the difference?|$\pm 8$ g. Absolute uncertainties are added for subtraction, giving $70 \pm 8$ g.|Subtracting the uncertainties is a common error. Uncertainty never decreases through a calculation.
d|qa|Give the relationship for percentage error.|$\text{percentage error} = \left\lvert\dfrac{\text{measured} - \text{true}}{\text{true}}\right\rvert \times 100\%$ — the absolute value bars mean the sign is discarded and the result is always positive.|
d|qa|Discriminate between absolute uncertainty and percentage error.|Absolute uncertainty describes the precision of the measurement itself, derived from the instrument and the spread of repeats. Percentage error describes accuracy — how far the result sits from an accepted or theoretical value. A result can have small uncertainty and large error.|A tight cluster of readings far from the true value has low uncertainty and high percentage error. This is the signature of systematic error.
d|qa|Define random error.|Unpredictable variation that scatters repeated measurements above and below the true value. Its causes include fluctuating conditions and limits on reading an instrument.|
d|qa|Define systematic error.|A consistent bias that shifts every measurement in the same direction by a similar amount. It arises from the experimental design or the equipment, such as an instrument that does not read zero with no load.|Repeats will not reveal or reduce it — it survives averaging untouched.
d|qa|Define precision.|The closeness of repeated measurements to one another. High precision means low scatter and a small uncertainty, regardless of whether the result is correct.|
d|qa|Define accuracy.|The closeness of a measurement to the true or accepted value. High accuracy means low percentage error.|
d|svg|Classify each of these four target patterns for accuracy and precision.|Top left: precise and accurate — tightly grouped on the centre. Top right: precise but not accurate — tightly grouped, offset, indicating systematic error. Bottom left: accurate but not precise — widely scattered but centred on average, indicating random error. Bottom right: neither.||<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img"><g stroke="currentColor" fill="none" stroke-width="1.3"><circle cx="72" cy="66" r="38"/><circle cx="72" cy="66" r="22"/><circle cx="72" cy="66" r="8"/><circle cx="212" cy="66" r="38"/><circle cx="212" cy="66" r="22"/><circle cx="212" cy="66" r="8"/><circle cx="72" cy="212" r="38"/><circle cx="72" cy="212" r="22"/><circle cx="72" cy="212" r="8"/><circle cx="212" cy="212" r="38"/><circle cx="212" cy="212" r="22"/><circle cx="212" cy="212" r="8"/></g><g fill="var(--signal)"><circle cx="70" cy="64" r="3.4"/><circle cx="75" cy="68" r="3.4"/><circle cx="71" cy="70" r="3.4"/><circle cx="196" cy="44" r="3.4"/><circle cx="201" cy="48" r="3.4"/><circle cx="197" cy="50" r="3.4"/><circle cx="48" cy="192" r="3.4"/><circle cx="94" cy="216" r="3.4"/><circle cx="70" cy="236" r="3.4"/><circle cx="82" cy="190" r="3.4"/><circle cx="182" cy="182" r="3.4"/><circle cx="196" cy="192" r="3.4"/><circle cx="176" cy="200" r="3.4"/><circle cx="204" cy="176" r="3.4"/></g><text x="20" y="122" font-size="10" font-family="monospace" fill="currentColor">precise + accurate</text><text x="162" y="122" font-size="10" font-family="monospace" fill="currentColor">precise only</text><text x="24" y="268" font-size="10" font-family="monospace" fill="currentColor">accurate only</text><text x="176" y="268" font-size="10" font-family="monospace" fill="currentColor">neither</text></svg>
d|qa|How many significant figures should a result of a multiplication or division carry?|The same number as the input value with the fewest significant figures.|
d|qa|How many decimal places should a result of an addition or subtraction carry?|The same number as the input value with the fewest decimal places.|
d|qa|To how many significant figures should an uncertainty normally be quoted?|One significant figure, with the measurement then rounded to the same decimal place: $12.47 \pm 0.03$, not $12.472 \pm 0.031$.|
d|svg|How are minimum and maximum lines of best fit used to find the uncertainty in a gradient?|Draw the steepest and shallowest straight lines that still pass through all the error bars. The uncertainty in the gradient is half the difference between them: $\Delta m = \dfrac{m_{max} - m_{min}}{2}$. The same method applied to the intercepts gives intercept uncertainty.||<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img"><line x1="36" y1="170" x2="280" y2="170" stroke="currentColor" stroke-width="1.3"/><line x1="36" y1="170" x2="36" y2="20" stroke="currentColor" stroke-width="1.3"/><g stroke="currentColor" stroke-width="1.5"><line x1="76" y1="132" x2="76" y2="156"/><line x1="70" y1="132" x2="82" y2="132"/><line x1="70" y1="156" x2="82" y2="156"/><line x1="132" y1="104" x2="132" y2="128"/><line x1="126" y1="104" x2="138" y2="104"/><line x1="126" y1="128" x2="138" y2="128"/><line x1="188" y1="72" x2="188" y2="96"/><line x1="182" y1="72" x2="194" y2="72"/><line x1="182" y1="96" x2="194" y2="96"/><line x1="244" y1="42" x2="244" y2="66"/><line x1="238" y1="42" x2="250" y2="42"/><line x1="238" y1="66" x2="250" y2="66"/></g><g fill="currentColor"><circle cx="76" cy="144" r="2.6"/><circle cx="132" cy="116" r="2.6"/><circle cx="188" cy="84" r="2.6"/><circle cx="244" cy="54" r="2.6"/></g><line x1="52" y1="160" x2="266" y2="46" stroke="var(--signal)" stroke-width="2"/><line x1="52" y1="152" x2="266" y2="38" stroke="var(--phos)" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="52" y1="166" x2="266" y2="58" stroke="var(--phos)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="196" y="34" font-size="10" font-family="monospace" fill="var(--phos)">max</text><text x="238" y="80" font-size="10" font-family="monospace" fill="var(--phos)">min</text></svg>
d|qa|An object falls from rest. What should be plotted to linearise the data, and what does the gradient represent?|Plot displacement $s$ against $t^2$. Since $s = \tfrac{1}{2}at^2$, the gradient equals $\tfrac{1}{2}a$, so acceleration is twice the gradient.|
d|qa|Orbital data is collected for several satellites. What should be plotted to produce a straight line, and what is the gradient?|Plot $T^2$ against $r^3$. From Kepler's third law the gradient is $\dfrac{4\pi^2}{GM}$, which yields the mass of the central body.|
d|qa|How should a line of best fit be drawn?|As a single smooth straight line or curve passing as close as possible to all points, with roughly equal numbers above and below. It should never be drawn dot to dot, and it need not pass through any particular data point.|
d|qa|Distinguish interpolation from extrapolation, and say which is more reliable.|Interpolation reads a value within the measured range; extrapolation projects beyond it. Interpolation is more reliable, because extrapolation assumes the relationship continues to hold where it has not been tested.|
d|qa|When can a set of data not be treated as a linear function?|When the points show clear systematic curvature, or when the residuals about a straight line follow a pattern rather than scattering randomly. In those cases a curve of best fit or linearisation is required.|
d|qa|How do you calculate a gradient from a graph, and what must accompany the value?|Take two widely separated points on the line of best fit, not raw data points, and compute rise over run. The gradient must be given with the units implied by the two axes.|
d|qa|How does measurement uncertainty influence conclusions?|If the uncertainty ranges of two results overlap, they cannot be claimed to be different. Uncertainty sets the limit on how strongly any conclusion can be stated.|
d|qa|An experiment is repeated many times with very consistent results, but the mean sits well away from the accepted value. What does this indicate?|A systematic error. High precision with low accuracy points to a consistent bias in the equipment or method, which further repeats will not fix.|
</script>
<script>
(function () {
  "use strict";

  var KEY = "qcaa.physics34.deck.v1";
  var DAY = 86400000;
  var INTERVALS = [0, 1, 3, 7, 16]; // days until next review, by box 1..5

  var TOPICS = [
    { k: "g", label: "Gravity + motion", unit: "U3" },
    { k: "e", label: "Electromagnetism", unit: "U3" },
    { k: "r", label: "Special relativity", unit: "U4" },
    { k: "q", label: "Quantum theory", unit: "U4" },
    { k: "s", label: "Standard Model", unit: "U4" },
    { k: "d", label: "Data + uncertainty", unit: "IA" }
  ];
  var TMAP = {};
  TOPICS.forEach(function (t) { TMAP[t.k] = t; });

  // ---------- deck ----------
  // Card identity is a hash of the question text, NOT the line position.
  // This keeps every student's Leitner box and flag attached to the right card
  // when cards are added, removed or reordered in a later release.
  function cardId(q) {
    var h = 2166136261;                       // FNV-1a 32-bit
    var t = q.replace(/\s+/g, " ").trim();
    for (var i = 0; i < t.length; i++) {
      h ^= t.charCodeAt(i);
      h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
    }
    return "q" + h.toString(36);
  }

  var raw = document.getElementById("deck").textContent.split("\n");
  var DECK = [];
  var seenIds = {};
  raw.forEach(function (line, i) {
    if (!line.trim()) return;
    var f = line.split("|");
    if (f.length < 4) return;
    var cid = cardId(f[2]);
    if (seenIds[cid]) cid = cid + "-" + i;    // collision guard
    seenIds[cid] = 1;
    DECK.push({
      id: cid,
      topic: f[0].trim(),
      type: f[1].trim(),
      q: f[2],
      a: f[3],
      note: (f[4] || "").trim(),
      svg: (f[5] || "").trim()
    });
  });

  // ---------- state ----------
  var state = load();

  function load() {
    var blank = { box: {}, due: {}, streak: 0, lastDay: null, filter: "all", flags: {} };
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (!s || typeof s !== "object") return blank;
      s.box = s.box || {}; s.due = s.due || {};
      s.streak = s.streak || 0;
      s.lastDay = s.lastDay || null;
      s.filter = s.filter || "all";
      s.flags = s.flags || {};
      return s;
    } catch (e) { return blank; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }
  function boxOf(c) { return state.box[c.id] || 1; }
  function dueAt(c) { return state.due[c.id] || 0; }
  function today() {
    var d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime();
  }

  // Drop stored progress for cards that no longer exist in this release.
  (function pruneState() {
    var live = {};
    DECK.forEach(function (c) { live[c.id] = 1; });
    var changed = false;
    ["box", "due", "flags"].forEach(function (k) {
      Object.keys(state[k] || {}).forEach(function (id) {
        if (!live[id]) { delete state[k][id]; changed = true; }
      });
    });
    if (changed) save();
  })();

  // ---------- session ----------
  var queue = [], current = null, revealed = false, studyAhead = false;

  function pool() {
    return DECK.filter(function (c) {
      return state.filter === "all" || c.topic === state.filter;
    });
  }
  function buildQueue() {
    var now = Date.now();
    var p = pool().filter(function (c) { return studyAhead || dueAt(c) <= now; });
    // due-first, then lowest box, then shuffled within
    shuffle(p);
    p.sort(function (a, b) { return boxOf(a) - boxOf(b); });
    queue = p;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function grade(correct) {
    if (!current) return;
    var b = boxOf(current);
    var nb = correct ? Math.min(5, b + 1) : 1;
    state.box[current.id] = nb;
    state.due[current.id] = Date.now() + INTERVALS[nb - 1] * DAY;
    bumpStreak();
    save();
    pulseSlot(nb);
    if (!correct) queue.push(current); // see it again this session
    queue.shift();
    next();
  }

  function bumpStreak() {
    var t = today();
    if (state.lastDay === t) return;
    state.streak = (state.lastDay === t - DAY) ? state.streak + 1 : 1;
    state.lastDay = t;
    paintStreak();
  }

  function next() {
    current = queue[0] || null;
    revealed = false;
    paint();
  }

  // ---------- maths ----------
  var GREEK = {
    theta: "\u03B8", lambda: "\u03BB", mu: "\u03BC", pi: "\u03C0", Delta: "\u0394",
    delta: "\u03B4", phi: "\u03C6", Phi: "\u03A6", varepsilon: "\u03B5",
    epsilon: "\u03B5", gamma: "\u03B3", nu: "\u03BD", alpha: "\u03B1", beta: "\u03B2",
    eta: "\u03B7", omega: "\u03C9", Omega: "\u03A9", rho: "\u03C1", sigma: "\u03C3",
    times: "\u00D7", pm: "\u00B1", approx: "\u2248", propto: "\u221D",
    rightarrow: "\u2192", leftarrow: "\u2190", perp: "\u22A5", infty: "\u221E",
    cdot: "\u00B7", circ: "\u00B0", parallel: "\u2225", lvert: "|", rvert: "|",
    ge: "\u2265", le: "\u2264", neq: "\u2260", to: "\u2192"
  };

  // Plain-text fallback if the KaTeX CDN is unreachable (blocked school network).
  function plainMath(s) {
    return s.replace(/\$([^$]+)\$/g, function (_, m) {
      var x = m;
      for (var i = 0; i < 4; i++) {
        x = x.replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1)/($2)");
      }
      x = x.replace(/\\sqrt\[([^\]]*)\]\{([^{}]*)\}/g, "$1\u221A($2)");
      x = x.replace(/\\sqrt\{([^{}]*)\}/g, "\u221A($1)");
      x = x.replace(/\\text\{([^{}]*)\}/g, "$1");
      x = x.replace(/\\bar\{([^{}]*)\}/g, "$1\u0304");
      x = x.replace(/\\(left|right)/g, "");
      x = x.replace(/\\([a-zA-Z]+)/g, function (mm, name) {
        return GREEK[name] !== undefined ? GREEK[name] : name;
      });
      x = x.replace(/\^\{([^{}]*)\}/g, "<sup>$1</sup>").replace(/\^(-?\w)/g, "<sup>$1</sup>");
      x = x.replace(/_\{([^{}]*)\}/g, "<sub>$1</sub>").replace(/_(\w)/g, "<sub>$1</sub>");
      x = x.replace(/[{}]/g, "");
      return "<i>" + x + "</i>";
    });
  }

  var katexReady = (typeof window.renderMathInElement === "function" && typeof window.katex === "object");

  function setMath(el, html) {
    if (katexReady) {
      el.innerHTML = html;
      try {
        window.renderMathInElement(el, {
          delimiters: [{ left: "$", right: "$", display: false }],
          throwOnError: false
        });
      } catch (e) { el.innerHTML = plainMath(html); }
    } else {
      el.innerHTML = plainMath(html);
    }
  }

  function clozeFront(s) {
    return s.replace(/\[\[([^\]]+)\]\]/g, '<span class="blank"></span>');
  }
  function clozeBack(s) {
    return s.replace(/\[\[([^\]]+)\]\]/g, '<span class="filled">$1</span>');
  }

  // ---------- render ----------
  var stage = document.getElementById("stage");
  var controls = document.getElementById("controls");
  var slotsEl = document.getElementById("slots");
  var filtersEl = document.getElementById("filters");

  function paintFilters() {
    filtersEl.innerHTML = "";
    var list = [{ k: "all", label: "All topics", unit: "" }].concat(TOPICS);
    list.forEach(function (t) {
      var b = document.createElement("button");
      b.className = "chip";
      b.type = "button";
      b.setAttribute("aria-pressed", state.filter === t.k ? "true" : "false");
      b.textContent = (t.unit ? t.unit + " " : "") + t.label;
      b.addEventListener("click", function () {
        state.filter = t.k; studyAhead = false; save();
        paintFilters(); buildQueue(); next();
      });
      filtersEl.appendChild(b);
    });
  }

  function paintSlots() {
    var counts = [0, 0, 0, 0, 0];
    pool().forEach(function (c) { counts[boxOf(c) - 1]++; });
    var total = pool().length || 1;
    slotsEl.innerHTML = "";
    for (var i = 0; i < 5; i++) {
      var d = document.createElement("div");
      d.className = "slot";
      d.setAttribute("data-b", i + 1);
      d.innerHTML =
        '<div class="fill" style="height:' + Math.round((counts[i] / total) * 100) + '%"></div>' +
        '<div class="lab">' + (i === 4 ? "LEARNT" : "B" + (i + 1)) + "</div>" +
        '<div class="n">' + counts[i] + "</div>";
      slotsEl.appendChild(d);
    }
  }
  function pulseSlot(n) {
    var el = slotsEl.children[n - 1];
    if (!el) return;
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
  }

  function paintStreak() {
    document.getElementById("streakN").textContent = state.streak;
    document.getElementById("streak").classList.toggle("live", state.lastDay === today() && state.streak > 0);
  }

  function nextDueText() {
    var p = pool(), soonest = Infinity;
    p.forEach(function (c) { var d = dueAt(c); if (d < soonest) soonest = d; });
    if (soonest === Infinity) return "nothing scheduled";
    var mins = Math.round((soonest - Date.now()) / 60000);
    if (mins <= 0) return "due now";
    if (mins < 90) return "next in " + mins + " min";
    var hrs = Math.round(mins / 60);
    if (hrs < 36) return "next in " + hrs + " h";
    return "next in " + Math.round(hrs / 24) + " days";
  }

  function paint() {
    paintSlots();
    paintFlagBar();
    var now = Date.now();
    var dueCount = pool().filter(function (c) { return dueAt(c) <= now; }).length;
    document.getElementById("dueLine").textContent = dueCount + " due of " + pool().length;

    if (!current) {
      stage.innerHTML =
        '<div class="empty"><h2>All caught up</h2><p>Every card in this selection has been reviewed and scheduled. ' +
        "Come back later, or keep going now — cards reviewed early still count.</p></div>";
      controls.innerHTML = "";
      var b = document.createElement("button");
      b.className = "btn ghost";
      b.textContent = "Keep going anyway";
      b.addEventListener("click", function () { studyAhead = true; buildQueue(); next(); });
      controls.appendChild(b);
      document.getElementById("counter").textContent = nextDueText();
      return;
    }

    var c = current;
    var t = TMAP[c.topic] || { label: c.topic, unit: "" };
    var card = document.createElement("div");
    card.className = "card";

    var meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = '<span class="topic">' + t.unit + " \u00B7 " + t.label + "</span>" +
      '<span class="box">Box ' + boxOf(c) + " of 5</span>";
    card.appendChild(meta);

    var q = document.createElement("div");
    q.className = "q";
    setMath(q, revealed ? clozeBack(c.q) : clozeFront(c.q));
    card.appendChild(q);

    if (c.svg) {
      var fig = document.createElement("div");
      fig.className = "fig";
      fig.innerHTML = c.svg;
      card.appendChild(fig);
    }

    if (revealed) {
      var a = document.createElement("div");
      a.className = "a";
      setMath(a, c.a);
      card.appendChild(a);
      if (c.note) {
        var n = document.createElement("div");
        n.className = "note";
        var inner = document.createElement("span");
        setMath(inner, c.note);
        n.innerHTML = "<b>Watch for</b>";
        n.appendChild(inner);
        card.appendChild(n);
      }
    }
    card.appendChild(Object.assign(document.createElement("div"), { className: "spacer" }));

    var fl = document.createElement("button");
    fl.type = "button";
    fl.className = "flagbtn" + (state.flags[c.id] ? " on" : "");
    fl.textContent = state.flags[c.id] ? "\u2691 Flagged as wrong" : "\u2690 Flag this card";
    fl.title = "Mark this card as wrong or confusing so it can be reviewed";
    fl.addEventListener("click", function (ev) {
      ev.stopPropagation();
      if (state.flags[c.id]) { delete state.flags[c.id]; }
      else { state.flags[c.id] = { q: c.q.slice(0, 160), t: c.topic, at: new Date().toISOString().slice(0, 10) }; }
      save(); paint();
    });
    card.appendChild(fl);

    stage.innerHTML = "";
    stage.appendChild(card);

    controls.innerHTML = "";
    if (!revealed) {
      var show = document.createElement("button");
      show.className = "btn";
      show.innerHTML = "Show answer <kbd>space</kbd>";
      show.addEventListener("click", reveal);
      controls.appendChild(show);
    } else {
      var g = document.createElement("div");
      g.className = "grade";
      var miss = document.createElement("button");
      miss.className = "btn miss";
      miss.innerHTML = "Missed <kbd>1</kbd>";
      miss.addEventListener("click", function () { grade(false); });
      var got = document.createElement("button");
      got.className = "btn got";
      got.innerHTML = "Got it <kbd>2</kbd>";
      got.addEventListener("click", function () { grade(true); });
      g.appendChild(miss); g.appendChild(got);
      controls.appendChild(g);
    }

    document.getElementById("counter").textContent =
      queue.length + (queue.length === 1 ? " card left" : " cards left") +
      (studyAhead ? " \u00B7 ahead of schedule" : "");
  }

  function reveal() {
    if (!current || revealed) return;
    var card = stage.querySelector(".card");
    if (card) card.classList.add("flipping");
    setTimeout(function () { revealed = true; paint(); }, 130);
  }

  // ---------- events ----------
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === " " || e.key === "Enter") {
      if (!revealed && current) { e.preventDefault(); reveal(); }
    } else if (revealed && (e.key === "1")) { grade(false); }
    else if (revealed && (e.key === "2")) { grade(true); }
  });

  function flagCount() { return Object.keys(state.flags || {}).length; }

  function paintFlagBar() {
    var n = flagCount(), el = document.getElementById("flagBtn");
    el.textContent = n ? "Send " + n + " flagged card" + (n === 1 ? "" : "s") : "";
    el.style.display = n ? "" : "none";
  }

  document.getElementById("flagBtn").addEventListener("click", function () {
    var lines = Object.keys(state.flags).map(function (id) {
      var f = state.flags[id];
      return id + "\t" + f.t + "\t" + f.at + "\t" + f.q.replace(/\s+/g, " ");
    });
    var body = "Flagged flashcards (" + lines.length + ")\n\n" + lines.join("\n");
    if (navigator.share) {
      navigator.share({ title: "Flagged Physics flashcards", text: body }).catch(function () {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(body).then(function () {
        alert("Copied " + lines.length + " flagged card(s). Paste them into an email to your teacher.");
      });
    } else {
      prompt("Copy this and send it to your teacher:", body);
    }
  });

  document.getElementById("shuffleBtn").addEventListener("click", function () {
    shuffle(queue); next();
  });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!confirm("Reset all progress? Every card returns to Box 1 and the streak clears. This cannot be undone.")) return;
    state = { box: {}, due: {}, streak: 0, lastDay: null, filter: state.filter, flags: {} };
    save(); studyAhead = false;
    paintStreak(); buildQueue(); next();
  });

  // ---------- start ----------
  paintFilters();
  paintStreak();
  paintFlagBar();
  buildQueue();
  next();
})();
</script>
</body>
</html>
